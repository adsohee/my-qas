<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Favorites</title>

  <link
    rel="stylesheet"
    href="./style.css?v=1"
  >

</head>

<body>

<header class="top-bar">

  <div class="top-tabs">

    <!-- 뒤로가기 -->
    <button
      class="top-tab"
      onclick="location.href='https://my.qas.kr/'"
    >

      <svg xmlns="http://www.w3.org/2000/svg"
           width="24"
           height="24"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>

      </svg>

    </button>

    <!-- 검색 -->

    <div class="search-wrap">

      <span class="search-divider">
        │
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Search..."
      >

    </div>

  </div>

</header>


<main class="main-screen">

  <div class="main-content">

    <div class="memo-container">

      <div class="memo-input-row">

        <input
          id="linkTitleInput"
          type="text"
          placeholder="제목"
        >

        <input
          id="linkUrlInput"
          type="text"
          placeholder="URL"
        >

        <button id="addLinkBtn">
          +
        </button>

      </div>

      <div id="linkList"></div>

    </div>

  </div>

</main>


<div id="toast"></div>

<footer class="bottom-text">

  <span>
    © Sohee
  </span>

</footer>

<script src="./script.js"></script>

</body>
</html>
